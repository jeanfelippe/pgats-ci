# CI de Nível 01 - Disparo Manual através de clique

# nome da pipeline
name: "Execução Manual"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch
on:
  workflow_dispatch:

# tarefas dentro da pipeline = jobs
jobs:

  # JOB 1: Validação do código (Adicionado aqui como um job separado)
  lint:
    name: Validar Código (Super-Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # O Super-Linter precisa disso para analisar o histórico do Git

      - name: Executar Super-Linter
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JOB 2: Seu teste e2e atual
  e2e-tests:
    name: Executando testes e2e
    runs-on: ubuntu-latest
    needs: lint # Crucial: Diz que este job só inicia se o job "lint" passar com sucesso!

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v4

      # instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalação do Yarn
      - name: Instalando Yarn
        run: npm install -g yarn
        
      # instalação das dependências
      - name: Instalando dependências
        run: yarn
        
      # instalação dos Browsers do Playwright
      - name: Instalando Browsers do Playwright
        run: yarn playwright install
        
      # executar os testes e2e
      - name: Executando testes e2e
        run: yarn run e2e